[package]
name = "backendless_toolkit_bin"
authors.workspace = true
description.workspace = true
documentation.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
version.workspace = true

[[bin]]
name = "backendless-toolkit"
path = "src/daemon.rs"

[[bin]]
name = "backendless-toolkit-mcp"
path = "src/mcp.rs"

[[bin]]
name = "backendless-toolkit-db"
path = "src/db.rs"

[dependencies]
base64 = "0.22"
backendless_console_sdk = { workspace = true }
backendless_toolkit_contract = { workspace = true }
backendless_toolkit_runtime = { workspace = true }
csv = "1.3"
dotenvy = "0.15"
env_logger = "0.11"
freemework_abstractions = { version = "=0.1.0-dev.4f62297a0593ebd689f4f8e568c7930e86a2012f", registry = "freemework" }
freemework_common = { version = "=0.1.0-dev.4f62297a0593ebd689f4f8e568c7930e86a2012f", registry = "freemework" }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.0", features = ["macros", "rt"] }
tokio-util = { version = "0.7", features = [] }

[build-dependencies]
cargo_metadata = "0.18"
